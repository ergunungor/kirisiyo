<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a Flutter Web app. To tell Flutter it is running as a PWA,
    please see: https://flutter.dev/to/web-pwa
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Kırışıyo - Arkadaşlarla harcamaları kolayca paylaşın. Tricount ve Splitwise alternatifi Türkçe uygulama.">
  <meta name="keywords" content="harcama paylaşımı, splitwise, tricount, arkadaş hesabı">
  <meta name="author" content="Kırışıyo Team">

  <!-- PWA Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kırışıyo">
  <meta name="theme-color" content="#6C63FF">

  <!-- Viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Apple Touch Icons -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Open Graph / Social -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Kırışıyo">
  <meta property="og:description" content="Arkadaşlarla harcamaları kolayca paylaşın.">
  <meta property="og:image" content="icons/Icon-512.png">

  <title>Kırışıyo</title>

  <style>
    /* Splash / loading state background */
    body {
      background-color: #0F0E1A;
      margin: 0;
      padding: 0;
    }

    /* Service worker update notification */
    #update-notification {
      display: none;
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #6C63FF;
      color: white;
      padding: 12px 24px;
      border-radius: 24px;
      font-family: sans-serif;
      font-size: 14px;
      cursor: pointer;
      z-index: 9999;
      box-shadow: 0 4px 20px rgba(108, 99, 255, 0.4);
    }
  </style>
</head>
<body>
  <div id="update-notification" onclick="window.location.reload()">
    🔄 Yeni sürüm mevcut! Güncellemek için tıklayın.
  </div>

  <script>
    // TODO [Developer 1]: Service Worker güncelleme bildirimi
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        document.getElementById('update-notification').style.display = 'block';
      });
    }
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
